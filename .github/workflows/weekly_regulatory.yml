# .github/workflows/weekly_regulatory.yml
#
# GitHub Actions workflow for Job 1: Weekly Regulatory Update
#
# This file tells GitHub WHEN to run the job and WHAT settings to use.
# The actual email-sending logic lives in scripts/send_email.py.
#
# To trigger this manually (for testing):
#   Go to GitHub repo → Actions tab → "Weekly Regulatory Update" → "Run workflow"

name: Weekly Regulatory Update

# Opt into Node.js 24 now — Node.js 20 actions are deprecated as of June 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# WHEN to run this workflow
on:
  schedule:
    # Cron format: minute  hour  day-of-month  month  day-of-week
    #                 0       7       *            *        1
    # Translation: At 07:00 UTC every Monday
    # (~3am ET in summer/EDT, ~2am ET in winter/EST)
    # Scheduled early to allow for GitHub Actions queue delays before business hours
    - cron: '0 7 * * 1'

  # workflow_dispatch lets you trigger this manually from GitHub's website.
  # This is essential for testing — you don't want to wait until Monday!
  workflow_dispatch:

jobs:
  send-regulatory-email:
    # GitHub provides free Ubuntu Linux virtual machines for running jobs
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download this repository's code onto the virtual machine
      # (The VM starts empty — it needs to fetch our script first)
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install Python 3.12 on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Run the email script with all required configuration
      - name: Send weekly regulatory update email
        # env: sets environment variables that scripts/send_email.py will read.
        # ${{ secrets.NAME }} pulls the value from GitHub's encrypted Secrets vault.
        # The secrets must be set up in: GitHub repo → Settings → Secrets → Actions
        env:
          # Authentication secrets (stored in GitHub Secrets — never hardcoded)
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CLAUDE_PROJECT_URL: ${{ secrets.REGULATORY_CLAUDE_URL }}

          # Job-specific configuration (not secret — lives here in the YAML)
          EMAIL_SUBJECT: "[COMPLIANCE] Weekly Regulatory Update — Ready to Run"
          JOB_NAME: "Weekly Regulatory Update"
          JOB_SCHEDULE_DESC: "Every Monday at ~3am ET"

          PROMPT_TEXT: |
            LEGAL & REGULATORY RESEARCH REQUEST: WEEKLY STABLECOIN REGULATORY INTELLIGENCE BRIEF

            1. LEGAL CONTEXT & FRAMEWORK
            - Expert(s) Conducting the Research: Former FinCEN policy official, former state money transmission regulator, payments regulatory attorney, bank regulatory counsel (OCC/Federal Reserve/FDIC), OFAC sanctions specialist, and fintech compliance executive with stablecoin and payments expertise.
            - Legal Domain: U.S. financial services regulation, stablecoin regulation, money transmission law, BSA/AML compliance, sanctions compliance, banking regulation, payments regulation, digital asset regulation.
            - Research Objective: Identify and assess newly published regulatory developments and enforcement actions that could materially affect the operations, compliance obligations, licensing requirements, risk profile, or strategic planning of a FinCEN-registered fiat-backed stablecoin issuer licensed as a money transmitter in 16+ U.S. states.
            - Jurisdictional Scope: United States federal and state regulatory authorities.
            - Organization Profile: FinCEN-registered fiat-backed stablecoin issuer operating under multiple state money transmitter licenses.
            - Potential Impact Focus: Compliance obligations, examination expectations, licensing requirements, reserve management, AML/KYC obligations, sanctions compliance, consumer protection requirements, prudential expectations, reporting obligations, supervisory scrutiny, and enforcement risk.
            2. CORE RESEARCH QUESTION
            - Primary Legal Question: What regulatory, supervisory, enforcement, or policy developments published within the last 7 calendar days could materially impact the operations of a U.S.-licensed fiat-backed stablecoin issuer and multi-state money transmitter?
            - Working Hypothesis: Recent developments may signal evolving regulatory expectations for stablecoin issuers, money transmitters, AML programs, sanctions compliance, reserve management, consumer protection, or licensing requirements.
            - Alternative Interpretations: Distinguish between legally binding requirements, proposed requirements, supervisory signals, policy statements, and nonbinding commentary.
            3. METHODOLOGICAL PARAMETERS
            - Research Design: Regulatory monitoring, legal analysis, enforcement review, and compliance impact assessment.
            - Temporal Scope: Only publications, announcements, guidance, speeches, enforcement actions, rulemakings, examination manuals, advisories, consent orders, settlements, policy statements, and supervisory communications issued within the previous 7 calendar days.
            - Required Sources:
              - FinCEN
              - OCC
              - FDIC
              - Federal Reserve
              - OFAC
              - Conference of State Bank Supervisors (CSBS)
              - State banking departments
              - State financial services regulators
              - State money transmitter licensing authorities
              - FATF
            - Include:
              - Final rules
              - Proposed rules
              - Requests for comment
              - Interpretive guidance
              - Regulatory advisories
              - Supervisory letters
              - Policy statements
              - Speeches or testimony indicating likely policy direction
              - Examination and compliance guidance
              - Consent orders
              - Settlements
              - Civil money penalties
              - Enforcement actions
              - Risk jurisdictional updates
            - Exclude:
              - General cryptocurrency market news
              - Industry commentary lacking regulatory significance
              - Opinion articles
              - Duplicate announcements

            4. REPORT OUTPUT SPECIFICATIONS
            - Report Structure: Executive regulatory briefing.
            - Analytical Depth: Level 2 (Executive legal and compliance memorandum).
            - Target Audience: Chief Compliance Officer, General Counsel, Chief Risk Officer, CEO, Board Risk Committee.

            Required Output Format:

            URGENCY RATING
            - One sentence at the top:
              - Critical
              - High
              - Moderate
              - Low
            - Explain in one sentence why.

            EXECUTIVE SUMMARY
            - 3–7 bullet summary of the week's most important developments.

            KEY FINDINGS

            For each item provide:

            1. Headline
            2. Regulator
            3. Publication Date
            4. Category:
              - Final Rule
              - Proposed Rule
              - Guidance
              - Enforcement Action
              - Supervisory Communication
              - Policy Statement
              - Other
            5. Plain-English Summary (maximum 150 words)
            6. Why It Matters to a Stablecoin Issuer
            7. Operational Impact Assessment:
              - High
              - Medium
              - Low
            8. Effective Date or Comment Deadline (if applicable)
            9. Source Link

            ENFORCEMENT WATCH
            - Separate section summarizing enforcement actions involving:
              - Stablecoin issuers
              - Money transmitters
              - Payments companies
              - Digital asset firms
              - AML failures
              - Sanctions violations
              - Licensing violations
              - Consumer protection violations
            - For each action include:
              - Alleged misconduct
              - Penalties imposed
              - Compliance lessons
              - Relevance to stablecoin operations

            ACTIONS TO CONSIDER
            - Provide a prioritized list:
              - Immediate (0–30 days)
              - Near-Term (30–90 days)
              - Strategic Monitoring
            - Focus only on practical actions justified by the reported developments.

            5. EVIDENCE HIERARCHY & SOURCE QUALITY
            - Tier 1 Sources:
              - Official regulator publications
              - Statutes
              - Regulations
              - Enforcement orders
              - Agency guidance
              - Official speeches and testimony
            - Tier 2 Sources:
              - CSBS materials
              - State regulator publications
            - Tier 3 Sources:
              - Major legal alerts only when used to explain primary sources
            - Every finding must be traceable to an original regulator source.

            6. QUALITY ASSURANCE
            - Clearly distinguish:
              - Binding legal requirements
              - Proposed requirements
              - Supervisory expectations
              - Informal policy signals
            - Identify uncertainty where applicable.
            - Highlight developments likely to affect:
              - AML/BSA programs
              - OFAC compliance
              - Licensing
              - Stablecoin reserves
              - Consumer disclosures
              - Custody arrangements
              - Bank partnerships
              - Examination readiness
              - Reporting obligations

            7. VALIDATION PROTOCOL
            - Flag developments that may require legal review.
            - Flag developments that may require board-level awareness.
            - Highlight any emerging regulatory trends observed across multiple agencies.
            - Conclude with a "What Changed This Week vs. Last Week" section summarizing any notable shift in regulatory posture.

        # Run the shared email script
        run: python scripts/send_email.py
